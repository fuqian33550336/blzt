<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>病历侦探 | 医学科普小游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 背景装饰 -->
    <div class="bg-decoration">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
        <div class="circle c3"></div>
    </div>

    <div class="container" id="mainContainer">
        <!-- 头部 -->
        <header>
            <div class="header-icon">🏥</div>
            <h1>病历侦探</h1>
            <p class="subtitle">根据病历描述，输入疾病名称，完成你的诊断</p>
            <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
                <button id="achievementsBtn" class="achievements-entry-btn">🏅 我的成就 <span id="achievementBadge" class="achievement-badge" style="display:none;">0</span></button>
                <button id="collectionBtn" class="achievements-entry-btn">📋 病例收藏 <span id="collectionBadge" class="collection-badge" style="display:none;">0</span></button>
                <button id="darkModeToggle" class="dark-mode-toggle" title="切换深色模式">🌙</button>
            </div>
            <!-- 统计栏 -->
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-icon">⭐</span>
                    <span>正确</span>
                    <span id="scoreCount" class="stat-val">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">📋</span>
                    <span>已答</span>
                    <span id="totalCount" class="stat-val">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">🎯</span>
                    <span>正确率</span>
                    <span id="accuracyRate" class="stat-val">—</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">🔥</span>
                    <span>连对</span>
                    <span id="streakCount" class="stat-val">0</span>
                </div>
            </div>
        </header>

        <!-- 难度选择 -->
        <div class="difficulty-bar">
            <span class="diff-label">难度：</span>
            <button class="diff-btn active" data-diff="easy">🟢 简单</button>
            <button class="diff-btn" data-diff="medium">🟡 中等</button>
            <button class="diff-btn" data-diff="hard">🔴 困难</button>
        </div>

        <!-- 病历卡片 -->
        <div class="case-card" id="caseCard">
            <div class="case-header">
                <h2>📝 病历信息</h2>
                <div class="case-meta" id="caseMeta">
                    <span id="caseDept">科室：—</span>
                    <span id="caseNo">第 <span id="caseNum">1</span> 题</span>
                </div>
            </div>
            <div id="caseDescription" class="description">加载中...</div>
        </div>

        <!-- 提示区域 -->
        <div class="hint-bar">
            <button id="hintBtn" class="hint-btn">💡 获取提示 <span id="hintCost">(-5分)</span></button>
            <div id="hintArea" class="hint-area" style="display:none;"></div>
        </div>

        <!-- 答题区域 -->
        <div class="answer-area">
            <div class="input-wrapper">
                <input type="text" id="diseaseInput" placeholder="请输入疾病名称，例如：高血压" autocomplete="off" maxlength="30">
                <span class="input-icon">🩺</span>
            </div>
            <div class="btn-group">
                <button id="submitBtn" class="btn-primary">🔍 提交诊断</button>
                <button id="nextBtn" class="btn-secondary">➡️ 下一病历</button>
                <button id="giveupBtn" class="btn-giveup">🏳️ 放弃查看</button>
            </div>
        </div>

        <!-- 结果区域 -->
        <div id="resultArea" class="result-area" style="display:none;"></div>

        <!-- 答对动画遮罩 -->
        <div id="celebrationOverlay" class="celebration-overlay" style="display:none;">
            <div class="celebration-content">
                <div class="big-emoji" id="celebEmoji">🎉</div>
                <div class="celeb-text" id="celebText">诊断正确！</div>
            </div>
        </div>

        <!-- 成就解锁提示（浮动toast） -->
        <div id="achievementToast" class="achievement-toast" style="display:none;">
            <div class="achievement-toast-icon" id="toastIcon">🏅</div>
            <div class="achievement-toast-body">
                <div class="achievement-toast-label">成就解锁！</div>
                <div class="achievement-toast-name" id="toastName">—</div>
            </div>
        </div>

        <!-- 病例收藏弹窗 -->
        <div id="collectionModal" class="collection-modal-overlay" style="display:none;">
            <div class="collection-modal-card">
                <div class="collection-modal-header">
                    <h3>📋 病例收藏</h3>
                    <button id="collectionCloseBtn" class="knowledge-close-btn">✕</button>
                </div>
                <p class="collection-sub" id="collectionProgress">已收集 0 / 18</p>
                <div class="collection-tabs">
                    <button class="collection-tab active" data-filter="all">全部</button>
                    <button class="collection-tab" data-filter="easy">🟢 简单</button>
                    <button class="collection-tab" data-filter="medium">🟡 中等</button>
                    <button class="collection-tab" data-filter="hard">🔴 困难</button>
                </div>
                <div id="collectionList" class="collection-list"></div>
            </div>
        </div>

        <!-- 成就大厅弹窗 -->
        <div id="achievementsModal" class="achievements-modal-overlay" style="display:none;">
            <div class="achievements-modal-card">
                <div class="achievements-modal-header">
                    <h3>🏅 成就大厅</h3>
                    <button id="achievementsCloseBtn" class="knowledge-close-btn">✕</button>
                </div>
                <p class="achievements-sub" id="achievementsProgress">已解锁 0 / 12</p>
                <div id="achievementsList" class="achievements-grid"></div>
            </div>
        </div>

        <!-- 疾病科普弹窗 -->
        <div id="knowledgeModal" class="knowledge-modal-overlay" style="display:none;">
            <div class="knowledge-modal-card">
                <div class="knowledge-modal-header">
                    <div class="knowledge-modal-title">
                        <h3>📖 疾病科普</h3>
                        <span class="knowledge-tag" id="knowledgeDiseaseTag"></span>
                    </div>
                    <button id="knowledgeCloseBtn" class="knowledge-close-btn">✕</button>
                </div>
                <div id="knowledgeContent" class="knowledge-content"></div>
                <div class="knowledge-footer">
                    <span class="knowledge-tips">💊 护理重点已高亮</span>
                </div>
            </div>
        </div>

        <!-- 题库完成弹窗 -->
        <div id="completionModal" class="completion-overlay" style="display:none;">
            <div class="completion-card">
                <div class="completion-icon">🏆</div>
                <h2>太棒了！题库通关</h2>
                <p class="completion-sub">你已经完成了<span id="modalDifficulty">—</span>难度的全部 <span id="modalTotal">0</span> 道病历</p>
                <div class="completion-stats">
                    <div class="comp-stat">
                        <span class="comp-stat-icon">⭐</span>
                        <span class="comp-stat-label">总积分</span>
                        <span class="comp-stat-val" id="modalScore">0</span>
                    </div>
                    <div class="comp-stat">
                        <span class="comp-stat-icon">🎯</span>
                        <span class="comp-stat-label">正确率</span>
                        <span class="comp-stat-val" id="modalAccuracy">—</span>
                    </div>
                    <div class="comp-stat">
                        <span class="comp-stat-icon">🔥</span>
                        <span class="comp-stat-label">最长连对</span>
                        <span class="comp-stat-val" id="modalMaxStreak">0</span>
                    </div>
                </div>
                <div class="completion-actions">
                    <button id="modalRestart" class="btn-primary">🔄 重新挑战本难度</button>
                    <button id="modalClose" class="btn-secondary">✕ 关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
